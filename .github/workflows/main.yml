
name: Secure DevSecOps Pipeline

on:
  push:
    branches:
      - master

  pull_request:
    branches:
      - master

  workflow_dispatch:

jobs:
  build_and_package:
    name: BUILD-JOB (${{ matrix.language }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        language:
          - javascript-typescript

    permissions:
      contents: read
      security-events: write
      actions: read

    steps:
      # 1. Checkout source code
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Configure Node.js and npm caching
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # 3. Initialize CodeQL security scanning
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-extended

      # 4. Install project dependencies
      - name: Install Dependencies
        run: npm ci

      # 5. Run application build
      - name: Build Application
        run: npm run build

      # 6. Execute unit tests
      - name: Run Tests
        run: echo "text completed!"

      # 7. Analyze source code for vulnerabilities
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"

      # 8. Upload build artifact
      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nodejs-build-artifact
          path: dist/
          if-no-files-found: warn
          
      # 9. Deploy
      - name: Deployement
        run: echo "app is deployed"

      - name: Rollback
        if: failure()
        run: echo "kubectl rollout undo deployment zomato"

          
